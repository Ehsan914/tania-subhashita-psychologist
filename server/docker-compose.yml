# Local PostgreSQL for development. The API and the site still run with `npm run dev`;
# only the database is in Docker. From server/: `npm run db:setup` starts it, applies the
# migrations and loads the site content (docs/site-design-and-wording.md).
#
# Reads POSTGRES_PASSWORD from server/.env (gitignored), where DATABASE_URL points here:
#   DATABASE_URL="postgresql://mindcare:<POSTGRES_PASSWORD>@localhost:5433/mindcare"
name: mindcare

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindcare
      POSTGRES_USER: mindcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    # 5433 on the host, so a Postgres already installed on 5432 doesn't clash
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mindcare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcare -d mindcare"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mindcare-db:
